[project]
name = "chatjimmy-openai-proxy"
version = "0.1.0"
description = "OpenAI-compatible local gateway for the chatjimmy.ai API"
requires-python = ">=3.10"
license = "MIT"
keywords = ["openai-compatible", "taalas", "llama", "llm", "inference", "chatjimmy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "requests>=2.28.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
chatjimmy-openai-proxy = "chatjimmy.server:main"

[project.urls]
Homepage = "https://github.com/Eyepan/chatjimmy-openai-proxy"
Issues = "https://github.com/Eyepan/chatjimmy-openai-proxy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatjimmy"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
